services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      UMASK: "${UMASK:-002}"
      TZ: ${TZ:-Etc/UTC}
      WEBUI_PORT: 4000
      TORRENTING_PORT: ${TORRENTING_PORT:-6881}
    ports:
      - "4000:4000"
      - "${TORRENTING_PORT:-6881}:${TORRENTING_PORT:-6881}"
      - "${TORRENTING_PORT:-6881}:${TORRENTING_PORT:-6881}/udp"
    volumes:
      - ./data/qbittorrent/config:/config
      - ./data/media/movies:/media/movies
      - ./data/media/tv:/media/tv
      - ./data/media/books:/media/books
      - ./data/media/comics:/media/comics
      - ./data/torrents/incomplete:/torrents/incomplete
      - ./data/torrents/downloads:/torrents/downloads
    restart: unless-stopped

  torrent-panel:
    build:
      context: .
    environment:
      CONFIG_DIR: ${CONFIG_DIR:-/config}
      UMASK: ${UMASK:-002}
      MOVIES_PATH: /media/movies
      TV_PATH: /media/tv
      BOOKS_PATH: /media/books
      COMICS_PATH: /media/comics
      INCOMPLETE_PATH: /torrents/incomplete
      DOWNLOADS_PATH: /torrents/downloads
      PORT: 8080
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - ./data/config:${CONFIG_DIR:-/config}
      - ./data/media/movies:/media/movies
      - ./data/media/tv:/media/tv
      - ./data/media/books:/media/books
      - ./data/media/comics:/media/comics
      - ./data/torrents/incomplete:/torrents/incomplete
      - ./data/torrents/downloads:/torrents/downloads
    depends_on:
      - qbittorrent
    restart: unless-stopped
